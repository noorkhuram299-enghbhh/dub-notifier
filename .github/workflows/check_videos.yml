name: Check channels and notify Telegram

on:
  schedule:
    - cron: "*/0.5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python scripts/check_and_notify.py

      - name: Commit updated config
        run: |
          git config user.name "dub-notifier-bot"
          git config user.email "actions@github.com"
          git add config/channels.json
          git diff --cached --quiet || git commit -m "Update last seen video IDs"
          git pull --rebase origin main
          git push
